    url: https://developer.nrel.gov/docs/
  - type: Signup
    url: https://developer.nrel.gov/signup/
  - type: Reference
    url: https://nsrdb.nrel.gov/
- aid: energy-utilities:weather-grid
  name: Weather APIs for Grid and Solar
  description: >-
    Weather APIs that feed grid-demand modelling, renewable generation forecasts, and outage operations.
    Includes the National Weather Service public API (no authentication, GeoJSON), OpenWeather solar irradiance
    and panel-output products, and commercial providers offering historical and predictive weather data
    used by utilities, ISOs, and energy traders.
  humanURL: https://api.weather.gov/
  baseURL: https://api.weather.gov
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - Weather
  - Solar Irradiance
  - Forecast
  - GeoJSON
  - Grid Demand
