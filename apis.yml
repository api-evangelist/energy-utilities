  - type: Documentation
    url: https://openweathermap.org/api/solar-energy-prediction
  - type: Documentation
    url: https://openweathermap.org/api/one-call-3
- aid: energy-utilities:ev-charging-interop
  name: EV Charging Interoperability Protocols
  description: >-
    Open protocols that govern communication between EV charging stations, charging management systems,
    and roaming hubs. OCPP is the charger-to-back-office protocol from the Open Charge Alliance. OCPI
    is the back-office-to-back-office roaming protocol. ISO 15118 handles vehicle-to-charger plug-and-charge.
    These specifications are the API contract for the EV charging network.
  humanURL: https://openchargealliance.org/protocols/open-charge-point-protocol/
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - EV Charging
  - OCPP
  - OCPI
  - Roaming
  - Smart Charging
  properties:
  - type: Documentation
    url: https://openchargealliance.org/protocols/open-charge-point-protocol/
  - type: Documentation
    url: https://evroaming.org/ocpi-protocol/
  - type: Repository
    url: https://github.com/ocpi/ocpi
  - type: Repository
    url: https://github.com/openchargealliance
- aid: energy-utilities:openadr
  name: OpenADR Demand Response
  description: >-
    OpenADR is an open, two-way information exchange model and Smart Grid standard for automating demand
    response and orchestrating distributed energy resources. The OpenADR Alliance publishes profile specifications,
    schema files, sample payloads, and test plans for utilities, aggregators, and DER vendors. OpenADR
    3.0 is the current generation.
  humanURL: https://www.openadr.org/
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - Demand Response
  - DER
  - Smart Grid
  - Standard
  properties:
  - type: Documentation
    url: https://www.openadr.org/specification
  - type: Reference
    url: https://www.openadr.org/openadr-30
- aid: energy-utilities:green-button
  name: Green Button (CMD / DMD / ESPI / CDS)
  description: >-
    Green Button is the consumer energy data standard for utilities and third-party solution providers.
    Connect My Data (CMD) is the machine-to-machine sharing flow. Download My Data (DMD) is the user-initiated
    export flow. The Energy Services Provider Interface (ESPI) defines the underlying REST and Atom payloads
    (UsagePoint, MeterReading, IntervalBlock, ReadingType). The Consumer Data Specification (CDS) is the
    working group's next-generation profile.
  humanURL: https://www.greenbuttonalliance.org/
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - Green Button
  - ESPI
  - CDS
  - Consumer Data
  - Authorization
  - Authentication
  tags_raw:
  - Green Button
  - ESPI
  - CDS
  - Consumer Data
  - Authorization
  - OAuth2
  properties:
  - type: Documentation
    url: https://greenbuttonalliance.github.io/OpenESPI-GreenButton-API-Documentation/API/
  - type: Repository
    url: https://github.com/GreenButtonAlliance
  - type: Reference
    url: https://www.greenbuttonalliance.org/developer-resources
- aid: energy-utilities:derms
  name: Distributed Energy Resource Management APIs
  description: >-
    DERMS platforms aggregate, monitor, dispatch, and optimize distributed energy resources such as rooftop
    solar, behind-the-meter batteries, EV chargers, and controllable loads. DERMS API surfaces typically
    wrap OpenADR for event signaling, IEEE 2030.5 (SEP 2.0) for device-level control, and proprietary
    REST APIs for telemetry, enrollment, and settlement.
  humanURL: https://www.openadr.org/
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - DERMS
  - DER
  - Aggregation
  - VPP
  - IEEE 2030.5
  properties:
  - type: Reference
    url: https://standards.ieee.org/ieee/2030.5/5897/
  - type: Reference
    url: https://www.openadr.org/openadr-30
