- aid: energy-utilities:iso-rto-markets
  name: ISO and RTO Wholesale Market APIs
  description: >-
    Independent System Operators and Regional Transmission Organizations publish locational marginal prices,
    load forecasts, generation mix, ancillary services awards, and capacity market data through public
    data portals and (where available) REST APIs. These are the primary sources for wholesale electricity
    market data in North America.
  humanURL: https://oasis.caiso.com/
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - Wholesale Market
  - LMP
