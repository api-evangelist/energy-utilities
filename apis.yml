  - type: Reference
    url: https://www.eia.gov/opendata/browser/
- aid: energy-utilities:nrel-developer
  name: NREL Developer Network APIs
  description: >-
    The National Renewable Energy Laboratory exposes a developer network of REST APIs covering solar resource
    (NSRDB, PVWatts), wind resource, alternative fuel stations, utility rates (URDB), transportation,
    buildings, and geothermal data. Authentication uses an api.data.gov key shared with other federal
    data programs.
  humanURL: https://developer.nrel.gov/
  baseURL: https://developer.nrel.gov/api
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - Renewable Energy
  - Solar
  - Wind
  - Utility Rates
  - Alternative Fuel
