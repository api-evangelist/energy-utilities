- aid: energy-utilities:eia-open-data
  name: EIA Open Data API
  description: >-
    The U.S. Energy Information Administration publishes time-series data covering electricity, natural
    gas, petroleum, coal, nuclear outages, renewables, and international energy through APIv2. Datasets
    are organized by major energy category and accessed with an api.data.gov key.
  humanURL: https://www.eia.gov/opendata/
  baseURL: https://api.eia.gov/v2
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
